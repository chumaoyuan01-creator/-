version: '3.8'

services:
  app:
    build: .
    container_name: moyun-app
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - app-data:/var/lib/flask-app
      - app-logs:/var/log/flask-app
    networks:
      - moyun-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: moyun-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - app
    networks:
      - moyun-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app-data:
  app-logs:

networks:
  moyun-net:
    driver: bridge
