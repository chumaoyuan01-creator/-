<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .error-container { text-align: center; padding: 40px; }
        .error-code { font-size: 120px; font-weight: 700; color: #c0c4cc; line-height: 1; }
        .error-title { font-size: 24px; color: #303133; margin: 20px 0 10px; }
        .error-desc { font-size: 14px; color: #909399; margin-bottom: 30px; }
        .back-btn { display: inline-block; padding: 10px 24px; background: #409eff; color: #fff; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .back-btn:hover { background: #337ecc; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-title">页面未找到</div>
        <div class="error-desc">您访问的页面不存在或已被移除</div>
        <a href="/" class="back-btn">返回首页</a>
    </div>
</body>
</html>
