<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <title>墨韵 · 文章创作工作台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #1c2330;
            --bg-hover: #21262d;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent: #7c8cf8;
            --accent-glow: rgba(124, 140, 248, 0.15);
            --accent-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success: #3fb950;
            --danger: #f85149;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .topbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        .topbar-brand {
            font-size: 20px;
            font-weight: 700;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .topbar-brand span { font-size: 14px; font-weight: 400; -webkit-text-fill-color: var(--text-muted); }
        .topbar-nav { display: flex; gap: 24px; align-items: center; }
        .topbar-nav a { color: var(--text-secondary); text-decoration: none; font-size: 14px; transition: color 0.3s; }
        .topbar-nav a:hover { color: var(--accent); }
        .topbar-user { font-size: 13px; color: var(--text-secondary); }
        .main-layout { display: flex; min-height: calc(100vh - 61px); }
        .config-panel {
            width: 380px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 24px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .config-panel::-webkit-scrollbar { width: 6px; }
        .config-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .method-cards { display: flex; gap: 12px; margin-bottom: 24px; }
        .method-card {
            flex: 1;
            padding: 16px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .method-card.active { border-color: var(--accent); background: var(--accent-glow); }
        .method-card:hover { border-color: var(--accent); }
        .method-card .icon { font-size: 24px; margin-bottom: 8px; }
        .method-card .label { font-size: 14px; font-weight: 600; }
        .method-card .desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .config-group { margin-bottom: 20px; }
        .config-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .genre-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .genre-card {
            padding: 10px 8px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 13px;
        }
        .genre-card.active { border-color: var(--accent); background: var(--accent-glow); color: var(--accent); }
        .genre-card:hover { border-color: var(--accent); }
        .genre-card .emoji { display: block; font-size: 18px; margin-bottom: 4px; }
        .input-field {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        .input-field:focus { outline: none; border-color: var(--accent); }
        textarea.input-field { resize: vertical; min-height: 60px; }
        select.input-field { cursor: pointer; }
        .length-slider { display: flex; align-items: center; gap: 12px; }
        .length-slider input[type=range] { flex: 1; accent-color: var(--accent); }
        .length-label { font-size: 13px; color: var(--accent); font-weight: 600; min-width: 80px; text-align: right; }
        .collapse-panel {
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
        }
        .collapse-header {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
        }
        .collapse-body { padding: 0 16px 16px; display: none; }
        .collapse-body.show { display: block; }
        .generate-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-grad);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124, 140, 248, 0.3); }
        .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .workspace { flex: 1; padding: 32px; overflow-y: auto; display: flex; flex-direction: column; }
        .workspace-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }
        .workspace-empty .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.3; }
        .workspace-empty .text { font-size: 16px; }
        .workspace-empty .hint { font-size: 13px; margin-top: 8px; }
        .result-container { max-width: 800px; margin: 0 auto; width: 100%; }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .result-tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .result-tag {
            padding: 4px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .result-tag.accent { color: var(--accent); border-color: var(--accent); }
        .result-stats { font-size: 12px; color: var(--text-muted); }
        .result-body {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            flex: 1;
        }
        .chapter-block { margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
        .chapter-block:last-child { border-bottom: none; }
        .chapter-title { font-size: 18px; font-weight: 700; color: var(--accent); margin-bottom: 12px; }
        .chapter-content { font-size: 15px; line-height: 2; color: var(--text-primary); white-space: pre-wrap; }
        .result-content { font-size: 15px; line-height: 2; color: var(--text-primary); white-space: pre-wrap; }
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .loading-state .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 16px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .action-bar { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .action-btn {
            padding: 8px 18px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            font-family: inherit;
        }
        .action-btn:hover { border-color: var(--accent); color: var(--accent); }
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            width: 90%; max-width: 400px;
            box-shadow: var(--shadow);
        }
        .modal h2 { font-size: 20px; margin-bottom: 20px; }
        .modal .input-field { margin-bottom: 12px; }
        .modal .modal-btn {
            width: 100%; padding: 12px;
            background: var(--accent-grad);
            color: #fff; border: none;
            border-radius: var(--radius-sm);
            font-size: 15px; cursor: pointer;
            font-family: inherit; font-weight: 600;
        }
        .modal .switch-text { text-align: center; margin-top: 16px; font-size: 14px; color: var(--text-muted); }
        .modal .switch-text a { color: var(--accent); cursor: pointer; }
        .error-msg { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }
        .error-msg.show { display: block; }
        .workspace::-webkit-scrollbar { width: 6px; }
        .workspace::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .workspace { margin-left: 0; }
            .main-layout { flex-direction: column; }
            .toolbar { flex-wrap: wrap; gap: 8px; }
            .toolbar button { font-size: 13px; padding: 6px 12px; }
            .card-grid { grid-template-columns: 1fr; }
            .modal-content { width: 95%; margin: 10% auto; }
            .form-row { flex-direction: column; }
            .form-row input, .form-row select { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-brand">墨韵 <span>· 文章创作工作台</span></div>
        <div class="topbar-nav">
            <a href="/history">📜 创作历史</a>
            <span class="topbar-user" id="userInfo"></span>
            <a href="javascript:void(0)" id="authLink" onclick="openAuthModal('login')">登录</a>
        </div>
    </div>

    <div class="main-layout">
        <div class="config-panel">
            <div class="config-group">
                <div class="config-label">作品体裁</div>
                <div class="method-cards">
                    <div class="method-card active" onclick="switchCategory('article', this)">
                        <div class="icon">📄</div>
                        <div class="label">文章</div>
                        <div class="desc">论述 · 分节</div>
                    </div>
                    <div class="method-card" onclick="switchCategory('novel', this)">
                        <div class="icon">📚</div>
                        <div class="label">小说</div>
                        <div class="desc">叙事 · 分章</div>
                    </div>
                </div>
            </div>

            <div class="config-group">
                <div class="config-label">文体类型</div>
                <div class="genre-grid" id="genreGrid">
                    <div class="genre-card active" data-value="散文"><span class="emoji">🍂</span>散文</div>
                    <div class="genre-card" data-value="短篇故事"><span class="emoji">📖</span>短篇故事</div>
                    <div class="genre-card" data-value="武侠片段"><span class="emoji">⚔️</span>武侠片段</div>
                    <div class="genre-card" data-value="言情片段"><span class="emoji">💕</span>言情片段</div>
                    <div class="genre-card" data-value="科幻小品"><span class="emoji">🚀</span>科幻小品</div>
                    <div class="genre-card" data-value="悬疑推理"><span class="emoji">🔍</span>悬疑推理</div>
                    <div class="genre-card" data-value="历史传奇"><span class="emoji">🏛️</span>历史传奇</div>
                    <div class="genre-card" data-value="都市生活"><span class="emoji">🏙️</span>都市生活</div>
                    <div class="genre-card" data-value="奇幻冒险"><span class="emoji">🐉</span>奇幻冒险</div>
                    <div class="genre-card" data-value="玄幻修真"><span class="emoji">⚡</span>玄幻修真</div>
                    <div class="genre-card" data-value="军事纪实"><span class="emoji">🎖️</span>军事纪实</div>
            </div>
        </div>

            <div class="config-group">
                <div class="config-label">文章主题</div>
                <input type="text" class="input-field" id="topic" placeholder="例如：秋天、故乡、青春、星空..." value="秋天">
            </div>

            <div class="config-group">
                <div class="config-label">关键词</div>
                <input type="text" class="input-field" id="keyword" placeholder="例如：银杏、老街、月光、飞船..." value="银杏">
            </div>

            <div class="config-group">
                <div class="config-label">作品篇幅</div>
                <div class="genre-grid" id="quickWords" style="margin-bottom:8px;">
                    <div class="word-card" data-words="2000" onclick="selectQuickWords(2000, this)">2000字</div>
                    <div class="word-card" data-words="5000" onclick="selectQuickWords(5000, this)">5000字</div>
                    <div class="word-card" data-words="10000" onclick="selectQuickWords(10000, this)">1万字</div>
                    <div class="word-card" data-words="50000" onclick="selectQuickWords(50000, this)">5万字</div>
                    <div class="word-card" data-words="100000" onclick="selectQuickWords(100000, this)">10万字</div>
                    <div class="word-card" data-words="500000" onclick="selectQuickWords(500000, this)">50万字</div>
                </div>
                <input type="number" class="input-field" id="customWords" placeholder="或输入自定义字数（500-2000000）" value="2000" min="500" max="2000000" style="margin-top:8px;">
            </div>

            <div class="collapse-panel" id="aiStylePanel">
                <div class="collapse-header" onclick="toggleCollapse('styleBody', 'styleArrow')">
                    <span>🎨 写作风格设置</span>
                    <span id="styleArrow">▲</span>
                </div>
                <div class="collapse-body show" id="styleBody">
                    <div class="config-group">
                        <div class="config-label">文风</div>
                        <select class="input-field" id="writingStyle">
                            <option value="抒情">抒情 · 情感饱满，以情动人</option>
                            <option value="冷静">冷静 · 克制客观，不发议论</option>
                            <option value="幽默">幽默 · 诙谐风趣，举重若轻</option>
                            <option value="犀利">犀利 · 观点尖锐，一针见血</option>
                            <option value="温润">温润 · 平和从容，娓娓道来</option>
                            <option value="苍凉">苍凉 · 沧桑厚重，带时代悲悯</option>
                            <option value="明快">明快 · 轻快明亮，节奏干净</option>
                        </select>
                    </div>
                    <div class="config-group" id="perspectiveGroup">
                        <div class="config-label">叙事视角 <span style="font-size:11px;color:var(--text-muted);font-weight:400;">（小说专属）</span></div>
                        <select class="input-field" id="narrativePerspective">
                            <option value="第三人称">第三人称</option>
                            <option value="第一人称">第一人称</option>
                            <option value="全知视角">全知视角</option>
                    </select>
                </div>
                <div class="config-group">
                    <div class="config-label">语言风格</div>
                    <select class="input-field" id="languageStyle">
                        <option value="现代白话">现代白话 · 干净流畅，当代通行</option>
                        <option value="古典文言">古典文言 · 凝练古雅，文言韵味</option>
                        <option value="市井口语">市井口语 · 生活口语，接地气</option>
                        <option value="书面雅正">书面雅正 · 庄重考究，正式得体</option>
                        <option value="网络语感">网络语感 · 轻松活泼，当代网感</option>
                    </select>
            </div>
            <div class="config-group">
                <div class="config-label">自定义约束</div>
                <textarea class="input-field" id="constraints" placeholder="如：必须包含对话、不超过3个人物、结尾留悬念..."></textarea>
            </div>
        </div>
        </div>

            <button class="generate-btn" id="generateBtn" onclick="generate()">✨ 开始创作</button>
        </div>

        <div class="workspace" id="workspace">
            <div class="workspace-empty" id="workspaceEmpty">
                <div class="icon">✍️</div>
                <div class="text">创作工作台</div>
                <div class="hint">在左侧配置创作参数，点击「开始创作」生成文章</div>
            </div>
            <div class="result-container" id="resultContainer" style="display:none;">
                <div class="result-header">
                    <div class="result-tags" id="resultTags"></div>
                    <div class="result-stats" id="resultStats"></div>
                </div>
                <div class="result-body" id="resultBody"></div>
                <div class="action-bar">
                    <button class="action-btn" onclick="copyResult()">📋 复制全文</button>
                    <button class="action-btn" onclick="downloadResult()">💾 下载文本</button>
                    <button class="action-btn" onclick="location.href='/history'">📜 创作历史</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <h2 id="authTitle">登录</h2>
            <div class="config-group">
                <input type="text" class="input-field" id="authUsername" placeholder="用户名">
            </div>
            <div class="config-group">
                <input type="password" class="input-field" id="authPassword" placeholder="密码（至少6位）">
            </div>
            <div class="error-msg" id="authError"></div>
            <button class="modal-btn" id="authSubmit" onclick="submitAuth()">登录</button>
            <div class="switch-text">
                <span id="switchText">还没有账号？</span>
                <a id="switchLink" onclick="openAuthModal('register')">注册</a>
            </div>
        </div>
    </div>

    <script>
        let selectedGenre = '散文';
        let selectedLength = 'medium';
        let lastArticleId = null;

        const lengthMap = { 0: ['short', '短篇'], 1: ['medium', '中篇'], 2: ['long', '长篇'], 3: ['long', '巨著'] };
        const articleWords = { 0: 2000, 1: 5000, 2: 10000, 3: 10000 };
        const novelWords = { 0: 150000, 1: 250000, 2: 300000, 3: 2000000 };
        let selectedCategory = 'article';
        const lengthWords = selectedCategory === 'novel' ? novelWords : articleWords;

        function selectQuickWords(words, el) {
            document.querySelectorAll('#quickWords .word-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('customWords').value = words;
        }

        document.querySelectorAll('#genreGrid .genre-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('#genreGrid .genre-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                selectedGenre = card.dataset.value;
            });
        });

        function switchCategory(category, el) {
            selectedCategory = category;
            document.querySelectorAll('.config-group')[0].querySelectorAll('.method-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            const pg = document.getElementById('perspectiveGroup');
            if (pg) { pg.style.display = (category === 'novel') ? 'block' : 'none'; }
        }

        function toggleCollapse(bodyId, arrowId) {
            const body = document.getElementById(bodyId);
            const arrow = document.getElementById(arrowId);
            body.classList.toggle('show');
            arrow.textContent = body.classList.contains('show') ? '▲' : '▼';
        }

        function generate() {
            const topic = document.getElementById('topic').value.trim();
            const keyword = document.getElementById('keyword').value.trim();
            if (!topic || !keyword) { alert('请填写文章主题和关键词'); return; }

            const btn = document.getElementById('generateBtn');
            const empty = document.getElementById('workspaceEmpty');
            const container = document.getElementById('resultContainer');
            const body = document.getElementById('resultBody');

            btn.disabled = true;
            btn.textContent = '创作中...';
            empty.style.display = 'none';
            container.style.display = 'block';
            body.innerHTML = '<div class="loading-state"><div class="spinner"></div>正在创作中，请稍候...</div>';

            const isAI = true;
            const sliderVal = 0;
            const isShort = false;
            const isLong = true;
            const tags = document.getElementById('resultTags');
            const stats = document.getElementById('resultStats');

            const targetWords = Math.max(500, Math.min(2000000, parseInt(document.getElementById('customWords').value) || 2000));

            if (isLong) {
                let asyncBody = { genre: selectedGenre, topic, keyword, target_words: targetWords, is_ai: isAI, format_type: selectedCategory };
                if (isAI) {
                    asyncBody.style = document.getElementById('writingStyle').value;
                    if (selectedCategory === 'novel') {
                        asyncBody.perspective = document.getElementById('narrativePerspective').value;
                    }
                    asyncBody.language_style = document.getElementById('languageStyle').value;
                    asyncBody.constraints = document.getElementById('constraints').value;
                }

                body.innerHTML = '<div class="loading-state"><div class="spinner"></div>正在拟定大纲...</div>';

                fetch('/api/ai/outline', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(asyncBody)
                })
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        body.innerHTML = '<p style="color:var(--danger)">大纲生成失败：' + data.error + '</p>';
                        btn.disabled = false;
                        btn.textContent = '✨ 开始创作';
                        return;
                    }
                    showOutlineEditor(data.outline, asyncBody, btn, body, tags, stats, isAI);
                })
                .catch(() => {
                    body.innerHTML = '<p style="color:var(--danger)">请求失败，请重试</p>';
                    btn.disabled = false;
                    btn.textContent = '✨ 开始创作';
                });
                return;
            }

            let url = '/api/ai/generate';
            let body_data = { genre: selectedGenre, topic, keyword, length: selectedLength };
            body_data.style = document.getElementById('writingStyle').value;
            if (selectedCategory === 'novel') {
                body_data.perspective = document.getElementById('narrativePerspective').value;
            }
            body_data.language_style = document.getElementById('languageStyle').value;
            body_data.constraints = document.getElementById('constraints').value;
            body_data.format_type = selectedCategory;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body_data)
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    body.innerHTML = '<p style="color:var(--danger)">生成失败：' + data.error + '</p>';
                    return;
                }
                lastArticleId = data.article_id;

                const isLongResult = (data.chapters && data.chapters.length > 0);

                if (isLongResult) {
                    tags.innerHTML = '<span class="result-tag accent">' + data.genre + '</span><span class="result-tag">共 ' + data.chapter_count + ' 章</span><span class="result-tag">约 ' + data.actual_words + ' 字</span>' + (isAI ? '<span class="result-tag accent">🤖 AI</span>' : '');
                    stats.textContent = '阅读约 ' + Math.ceil(data.actual_words / 300) + ' 分钟';
                    let html = '';
                    data.chapters.forEach(ch => {
                        html += '<div class="chapter-block">';
                        html += '<div class="chapter-title">' + ch.chapter_title + '</div>';
                        html += '<div class="chapter-content">' + ch.content + '</div>';
                        html += '</div>';
                    });
                    body.innerHTML = html;
                } else {
                    const wc = data.content.replace(/\s/g, '').length;
                    tags.innerHTML = '<span class="result-tag accent">' + data.genre + '</span><span class="result-tag">约 ' + wc + ' 字</span>' + (isAI ? '<span class="result-tag accent">🤖 AI</span>' : '');
                    stats.textContent = '阅读约 ' + Math.ceil(wc / 300) + ' 分钟';
                    body.innerHTML = '<div class="result-content">' + data.content + '</div>';
                }
            })
            .catch(() => { body.innerHTML = '<p style="color:var(--danger)">请求失败，请重试</p>'; })
            .finally(() => { btn.disabled = false; btn.textContent = '✨ 开始创作'; });
        }

        function showOutlineEditor(outline, asyncBody, btn, body, tags, stats, isAI) {
            let html = '<div style="padding:8px 0 20px;">';
            html += '<div style="font-size:17px;font-weight:700;margin-bottom:8px;">📋 大纲已生成，请确认</div>';
            html += '<div style="font-size:13px;color:var(--text-muted);margin-bottom:20px;">您可以修改标题、删除或新增条目，确认后按此大纲逐节生成正文。</div>';
            html += '<div id="outlineList">';
            outline.forEach((item) => {
                const t = (item.chapter_title || '').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                html += '<div class="outline-row" style="display:flex;gap:8px;margin-bottom:10px;align-items:center;">';
                html += '<input type="text" class="input-field" style="flex:1;" value="' + t + '">';
                html += '<button class="action-btn danger" onclick="this.parentNode.remove()">删除</button>';
                html += '</div>';
            });
            html += '</div>';
            html += '<button class="action-btn" style="margin-top:6px;" onclick="addOutlineRow()">＋ 新增一节</button>';
            html += '<div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;">';
            html += '<button class="action-btn success" onclick="confirmOutline()">✅ 确认大纲，开始生成</button>';
            html += '<button class="action-btn" onclick="generate()">🔄 重新拟定</button>';
            html += '</div></div>';
            body.innerHTML = html;

            window._outlineBody = asyncBody;
            window._outlineBtn = btn;
            window._outlineTags = tags;
            window._outlineStats = stats;
            window._outlineIsAI = isAI;
        }

        function addOutlineRow() {
            const list = document.getElementById('outlineList');
            const row = document.createElement('div');
            row.className = 'outline-row';
            row.style.cssText = 'display:flex;gap:8px;margin-bottom:10px;align-items:center;';
            row.innerHTML = '<input type="text" class="input-field" style="flex:1;" placeholder="输入本节标题">' +
                '<button class="action-btn danger" onclick="this.parentNode.remove()">删除</button>';
            list.appendChild(row);
        }

        function confirmOutline() {
            const rows = document.querySelectorAll('#outlineList .outline-row input');
            const customOutline = [];
            rows.forEach((inp, i) => {
                const t = inp.value.trim();
                if (t) customOutline.push({ chapter_index: i + 1, chapter_title: t });
            });
            if (customOutline.length === 0) { alert('请至少保留一节'); return; }

            const body = document.getElementById('resultBody');
            const asyncBody = window._outlineBody;
            const btn = window._outlineBtn;
            const tags = window._outlineTags;
            const stats = window._outlineStats;
            const isAI = window._outlineIsAI;

            asyncBody.custom_outline = customOutline;
            asyncBody.is_ai = true;

            body.innerHTML = '<div class="loading-state"><div class="spinner"></div><div id="progressText">正在提交生成任务...</div><div style="margin-top:12px;width:100%;background:var(--bg-tertiary);border-radius:4px;overflow:hidden;"><div id="progressBar" style="width:0%;height:8px;background:var(--accent-grad);transition:width 0.5s;"></div></div><button class="action-btn danger" style="margin-top:16px;" id="cancelBtn" onclick="cancelGeneration()">取消生成</button></div>';

            fetch('/api/generate/async', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(asyncBody)
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    body.innerHTML = '<p style="color:var(--danger)">提交失败：' + data.error + '</p>';
                    btn.disabled = false;
                    btn.textContent = '✨ 开始创作';
                    return;
                }
                window.currentTaskId = data.task_id;
                pollGenerationStatus(data.task_id, btn, body, tags, stats, isAI);
            })
            .catch(() => {
                body.innerHTML = '<p style="color:var(--danger)">请求失败，请重试</p>';
                btn.disabled = false;
                btn.textContent = '✨ 开始创作';
            });
        }

        let pollTimer = null;

        function pollGenerationStatus(taskId, btn, body, tags, stats, isAI) {
            pollTimer = setInterval(() => {
                fetch('/api/generate/status/' + taskId)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        clearInterval(pollTimer);
                        body.innerHTML = '<p style="color:var(--danger)">查询失败：' + data.error + '</p>';
                        btn.disabled = false;
                        btn.textContent = '✨ 开始创作';
                        return;
                    }
                    const progressText = document.getElementById('progressText');
                    const progressBar = document.getElementById('progressBar');
                    if (data.status === 'generating') {
                        if (progressText) progressText.textContent = '正在生成第 ' + data.current_chapter + '/' + data.total_chapters + ' 章...';
                        if (progressBar) progressBar.style.width = data.progress + '%';
                    } else if (data.status === 'completed') {
                        clearInterval(pollTimer);
                        lastArticleId = data.article_id;
                        if (progressText) progressText.textContent = '生成完成！';
                        if (progressBar) progressBar.style.width = '100%';
                        tags.innerHTML = '<span class="result-tag accent">共 ' + data.chapter_count + ' 章</span><span class="result-tag">约 ' + data.actual_words + ' 字</span>' + (isAI ? '<span class="result-tag accent">🤖 AI</span>' : '');
                        stats.textContent = '阅读约 ' + Math.ceil(data.actual_words / 300) + ' 分钟';
                        body.innerHTML = '<div style="text-align:center;padding:40px;"><div style="font-size:48px;margin-bottom:16px;">✅</div><p style="font-size:18px;margin-bottom:8px;">生成完成！</p><p style="color:var(--text-muted);margin-bottom:20px;">共 ' + data.chapter_count + ' 章，约 ' + data.actual_words + ' 字</p><button class="action-btn" onclick="location.href=\'/article/' + data.article_id + '\'">📖 查看文章详情</button></div>';
                        btn.disabled = false;
                        btn.textContent = '✨ 开始创作';
                    } else if (data.status === 'failed') {
                        clearInterval(pollTimer);
                        body.innerHTML = '<p style="color:var(--danger)">生成失败：' + (data.error || '未知错误') + '</p>';
                        btn.disabled = false;
                        btn.textContent = '✨ 开始创作';
                    } else if (data.status === 'cancelled') {
                        clearInterval(pollTimer);
                        body.innerHTML = '<p style="color:var(--text-muted)">已取消生成</p>';
                        btn.disabled = false;
                        btn.textContent = '✨ 开始创作';
                    }
                })
                .catch(() => {});
            }, 3000);
        }

        function cancelGeneration() {
            if (window.currentTaskId) {
                fetch('/api/generate/cancel/' + window.currentTaskId, { method: 'POST' })
                .then(() => {})
                .catch(() => {});
            }
            if (pollTimer) clearInterval(pollTimer);
            const btn = document.getElementById('generateBtn');
            const body = document.getElementById('resultBody');
            if (btn) { btn.disabled = false; btn.textContent = '✨ 开始创作'; }
            if (body) { body.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:40px;">已取消生成</p>'; }
        }

        function copyResult() {
            const text = document.getElementById('resultBody').innerText;
            navigator.clipboard.writeText(text).then(() => alert('已复制到剪贴板'));
        }

        function downloadResult() {
            const text = document.getElementById('resultBody').innerText;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'article_' + (lastArticleId || 'export') + '.txt';
            a.click();
        }

        function viewArticleDetail() {
            if (lastArticleId) { window.location.href = '/article/' + lastArticleId; }
        }

        let authMode = 'login';

        function openAuthModal(mode) {
            authMode = mode;
            document.getElementById('authModal').classList.add('show');
            document.getElementById('authTitle').textContent = mode === 'login' ? '登录' : '注册';
            document.getElementById('authSubmit').textContent = mode === 'login' ? '登录' : '注册';
            document.getElementById('switchText').textContent = mode === 'login' ? '还没有账号？' : '已有账号？';
            document.getElementById('switchLink').textContent = mode === 'login' ? '注册' : '登录';
            document.getElementById('authError').classList.remove('show');
        }

        function submitAuth() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const errorEl = document.getElementById('authError');

            if (!username || !password) {
                errorEl.textContent = '请填写用户名和密码';
                errorEl.classList.add('show');
                return;
            }

            fetch('/api/' + authMode, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    errorEl.textContent = data.error;
                    errorEl.classList.add('show');
                } else {
                    document.getElementById('authModal').classList.remove('show');
                    checkUserStatus();
                }
            })
            .catch(() => {
                errorEl.textContent = '请求失败，请重试';
                errorEl.classList.add('show');
            });
        }

        function checkUserStatus() {
            fetch('/api/user/status')
            .then(res => res.json())
            .then(data => {
                const userInfo = document.getElementById('userInfo');
                const authLink = document.getElementById('authLink');
                if (data.logged_in) {
                    userInfo.textContent = '👤 ' + data.username;
                    authLink.textContent = '退出';
                    authLink.onclick = () => {
                        fetch('/api/logout', { method: 'POST' })
                        .then(() => checkUserStatus());
                    };
                } else {
                    userInfo.textContent = '';
                    authLink.textContent = '登录';
                    authLink.onclick = () => openAuthModal('login');
                }
            });
        }

        checkUserStatus();
    </script>
</body>
</html>
