<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <title>墨韵 · 文章创作工作台</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="topbar">
        <div class="topbar-brand">墨韵 <span>· 文章创作工作台</span></div>
        <div class="topbar-nav">
            <a href="/history">📜 创作历史</a>
            <span class="topbar-user" id="userInfo"></span>
            <a href="javascript:void(0)" id="authLink" onclick="openAuthModal('login')">登录</a>
        </div>
    </div>

    <div class="main-layout">
        <div class="config-panel">
            <div class="config-group">
                <div class="config-label">作品体裁</div>
                <div class="method-cards">
                    <div class="method-card active" onclick="switchCategory('article', this)">
                        <div class="icon">📄</div>
                        <div class="label">文章</div>
                        <div class="desc">论述 · 分节</div>
                    </div>
                    <div class="method-card" onclick="switchCategory('novel', this)">
                        <div class="icon">📚</div>
                        <div class="label">小说</div>
                        <div class="desc">叙事 · 分章</div>
                    </div>
                </div>
            </div>

            <div class="config-group">
                <div class="config-label">文体类型</div>
                <div class="genre-grid" id="genreGrid">
                    <div class="genre-card active" data-value="散文"><span class="emoji">🍂</span>散文</div>
                    <div class="genre-card" data-value="短篇故事"><span class="emoji">📖</span>短篇故事</div>
                    <div class="genre-card" data-value="武侠片段"><span class="emoji">⚔️</span>武侠片段</div>
                    <div class="genre-card" data-value="言情片段"><span class="emoji">💕</span>言情片段</div>
                    <div class="genre-card" data-value="科幻小品"><span class="emoji">🚀</span>科幻小品</div>
                    <div class="genre-card" data-value="悬疑推理"><span class="emoji">🔍</span>悬疑推理</div>
                    <div class="genre-card" data-value="历史传奇"><span class="emoji">🏛️</span>历史传奇</div>
                    <div class="genre-card" data-value="都市生活"><span class="emoji">🏙️</span>都市生活</div>
                    <div class="genre-card" data-value="奇幻冒险"><span class="emoji">🐉</span>奇幻冒险</div>
                    <div class="genre-card" data-value="玄幻修真"><span class="emoji">⚡</span>玄幻修真</div>
                    <div class="genre-card" data-value="军事纪实"><span class="emoji">🎖️</span>军事纪实</div>
            </div>
        </div>

            <div class="config-group">
                <div class="config-label">文章主题</div>
                <input type="text" class="input-field" id="topic" placeholder="例如：秋天、故乡、青春、星空..." value="秋天">
            </div>

            <div class="config-group">
                <div class="config-label">关键词</div>
                <input type="text" class="input-field" id="keyword" placeholder="例如：银杏、老街、月光、飞船..." value="银杏">
            </div>

            <div class="config-group">
                <div class="config-label">作品篇幅</div>
                <div class="genre-grid" id="quickWords" style="margin-bottom:8px;">
                    <div class="word-card" data-words="2000" onclick="selectQuickWords(2000, this)">2000字</div>
                    <div class="word-card" data-words="5000" onclick="selectQuickWords(5000, this)">5000字</div>
                    <div class="word-card" data-words="10000" onclick="selectQuickWords(10000, this)">1万字</div>
                    <div class="word-card" data-words="50000" onclick="selectQuickWords(50000, this)">5万字</div>
                    <div class="word-card" data-words="100000" onclick="selectQuickWords(100000, this)">10万字</div>
                    <div class="word-card" data-words="500000" onclick="selectQuickWords(500000, this)">50万字</div>
                </div>
                <input type="number" class="input-field" id="customWords" placeholder="或输入自定义字数（500-2000000）" value="2000" min="500" max="2000000" style="margin-top:8px;">
            </div>

            <div class="collapse-panel" id="aiStylePanel">
                <div class="collapse-header" onclick="toggleCollapse('styleBody', 'styleArrow')">
                    <span>🎨 写作风格设置</span>
                    <span id="styleArrow">▲</span>
                </div>
                <div class="collapse-body show" id="styleBody">
                    <div class="config-group">
                        <div class="config-label">文风</div>
                        <select class="input-field" id="writingStyle">
                            <option value="抒情">抒情 · 情感饱满，以情动人</option>
                            <option value="冷静">冷静 · 克制客观，不发议论</option>
                            <option value="幽默">幽默 · 诙谐风趣，举重若轻</option>
                            <option value="犀利">犀利 · 观点尖锐，一针见血</option>
                            <option value="温润">温润 · 平和从容，娓娓道来</option>
                            <option value="苍凉">苍凉 · 沧桑厚重，带时代悲悯</option>
                            <option value="明快">明快 · 轻快明亮，节奏干净</option>
                        </select>
                    </div>
                    <div class="config-group" id="perspectiveGroup">
                        <div class="config-label">叙事视角 <span style="font-size:11px;color:var(--text-muted);font-weight:400;">（小说专属）</span></div>
                        <select class="input-field" id="narrativePerspective">
                            <option value="第三人称">第三人称</option>
                            <option value="第一人称">第一人称</option>
                            <option value="全知视角">全知视角</option>
                    </select>
                </div>
                <div class="config-group">
                    <div class="config-label">语言风格</div>
                    <select class="input-field" id="languageStyle">
                        <option value="现代白话">现代白话 · 干净流畅，当代通行</option>
                        <option value="古典文言">古典文言 · 凝练古雅，文言韵味</option>
                        <option value="市井口语">市井口语 · 生活口语，接地气</option>
                        <option value="书面雅正">书面雅正 · 庄重考究，正式得体</option>
                        <option value="网络语感">网络语感 · 轻松活泼，当代网感</option>
                    </select>
            </div>
            <div class="config-group">
                <div class="config-label">自定义约束</div>
                <textarea class="input-field" id="constraints" placeholder="如：必须包含对话、不超过3个人物、结尾留悬念..."></textarea>
            </div>
        </div>
        </div>

            <button class="generate-btn" id="generateBtn" onclick="generate()">✨ 开始创作</button>
        </div>

        <div class="workspace" id="workspace">
            <div class="workspace-empty" id="workspaceEmpty">
                <div class="icon">✍️</div>
                <div class="text">创作工作台</div>
                <div class="hint">在左侧配置创作参数，点击「开始创作」生成文章</div>
            </div>
            <div class="result-container" id="resultContainer" style="display:none;">
                <div class="result-header">
                    <div class="result-tags" id="resultTags"></div>
                    <div class="result-stats" id="resultStats"></div>
                </div>
                <div class="result-body" id="resultBody"></div>
                <div class="action-bar">
                    <button class="action-btn" onclick="copyResult()">📋 复制全文</button>
                    <button class="action-btn" onclick="downloadResult()">💾 下载文本</button>
                    <button class="action-btn" onclick="location.href='/history'">📜 创作历史</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <h2 id="authTitle">登录</h2>
            <div class="config-group">
                <input type="text" class="input-field" id="authUsername" placeholder="用户名">
            </div>
            <div class="config-group">
                <input type="password" class="input-field" id="authPassword" placeholder="密码（至少6位）">
            </div>
            <div class="error-msg" id="authError"></div>
            <button class="modal-btn" id="authSubmit" onclick="submitAuth()">登录</button>
            <div class="switch-text">
                <span id="switchText">还没有账号？</span>
                <a id="switchLink" onclick="openAuthModal('register')">注册</a>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
