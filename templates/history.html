<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品库 - 墨韵</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #1c2330;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent: #7c8cf8;
            --accent-glow: rgba(124, 140, 248, 0.15);
            --accent-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --danger: #f85149;
            --success: #3fb950;
            --gold: #ffd866;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .topbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar-brand {
            font-size: 20px;
            font-weight: 700;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .topbar-nav { display: flex; gap: 24px; align-items: center; }
        .topbar-nav a { color: var(--text-secondary); text-decoration: none; font-size: 14px; transition: color 0.3s; }
        .topbar-nav a:hover { color: var(--accent); }
        .content { max-width: 1000px; margin: 0 auto; padding: 32px 24px 80px; }

        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .page-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            padding: 18px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .toolbar input, .toolbar select {
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
        }
        .toolbar input { flex: 1; min-width: 180px; }
        .toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--accent); }
        .toolbar .filter-btn {
            padding: 10px 18px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.25s;
        }
        .toolbar .filter-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

        .work-list { display: flex; flex-direction: column; gap: 14px; }
        .work-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            transition: all 0.25s;
        }
        .work-card:hover { border-color: var(--accent); transform: translateX(3px); }
        .work-card.fav { border-left: 3px solid var(--gold); }
        .work-info { flex: 1; min-width: 0; }
        .work-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .work-title .star { color: var(--gold); }
        .work-meta { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag {
            font-size: 12px;
            padding: 3px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
        }
        .tag-accent { color: var(--accent); border-color: var(--accent); }
        .work-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .btn {
            padding: 7px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.25s;
            font-family: inherit;
            white-space: nowrap;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-star { border-color: var(--gold); color: var(--gold); }
        .btn-star:hover { background: var(--gold); color: #222; }

        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 56px; opacity: 0.3; margin-bottom: 16px; }
        .empty-state a { color: var(--accent); text-decoration: none; }
        .loading { text-align: center; padding: 60px; color: var(--text-muted); }
        .loading .spinner {
            width: 36px; height: 36px;
            margin: 0 auto 16px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-brand">墨韵</div>
        <div class="topbar-nav">
            <a href="/">✍️ 创作</a>
            <a href="/history">📚 作品库</a>
        </div>
    </div>
    <div class="content">
        <div class="page-title">📚 作品库</div>
        <div class="page-sub" id="pageSub">您的全部创作</div>

        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="搜索标题、主题或关键词..." oninput="debouncedLoad()">
            <select id="genreSelect" onchange="loadArticles()">
                <option value="">全部题材</option>
            </select>
            <button class="filter-btn" id="favBtn" onclick="toggleFavFilter()">⭐ 仅看收藏</button>
        </div>

        <div class="work-list" id="workList">
            <div class="loading"><div class="spinner"></div>加载中...</div>
        </div>
    </div>
    <script>
        let favOnly = false;
        let debounceTimer = null;

        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function debouncedLoad() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(loadArticles, 300);
        }

        function toggleFavFilter() {
            favOnly = !favOnly;
            document.getElementById('favBtn').classList.toggle('active', favOnly);
            loadArticles();
        }

        function loadGenres() {
            fetch('/api/genres')
            .then(res => res.json())
            .then(data => {
                const sel = document.getElementById('genreSelect');
                (data.genres || []).forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g;
                    sel.appendChild(opt);
                });
            });
        }

        function loadArticles() {
            const q = document.getElementById('searchInput').value.trim();
            const genre = document.getElementById('genreSelect').value;
            const params = new URLSearchParams();
            if (q) params.set('q', q);
            if (genre) params.set('genre', genre);
            if (favOnly) params.set('fav', '1');

            const list = document.getElementById('workList');
            list.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';

            fetch('/api/articles?' + params.toString())
            .then(res => res.json())
            .then(data => {
                const works = data.articles || [];
                const sub = document.getElementById('pageSub');
                if (sub) sub.textContent = '共 ' + works.length + ' 篇作品';
                if (works.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>没有找到作品</p><p style="margin-top:10px;"><a href="/">去创作一篇 ✨</a></p></div>';
                    return;
                }
                let html = '';
                works.forEach(a => {
                    html += '<div class="work-card' + (a.is_favorite ? ' fav' : '') + '">';
                    html += '<div class="work-info">';
                    html += '<div class="work-title">' + (a.is_favorite ? '<span class="star">★</span>' : '') + esc(a.title) + '</div>';
                    html += '<div class="work-meta">';
                    html += '<span class="tag tag-accent">' + esc(a.genre) + '</span>';
                    html += '<span class="tag">主题 · ' + esc(a.topic) + '</span>';
                    html += '<span class="tag">' + a.chapter_count + ' 部分</span>';
                    html += '<span class="tag">' + a.word_count + ' 字</span>';
                    html += '<span class="tag">' + esc(a.created_at) + '</span>';
                    html += '</div></div>';
                    html += '<div class="work-actions">';
                    html += '<button class="btn" onclick="location.href=\'/article/' + a.id + '\'">阅读</button>';
                    html += '<button class="btn" onclick="renameWork(' + a.id + ')">重命名</button>';
                    html += '<button class="btn btn-star" onclick="toggleFav(' + a.id + ')">' + (a.is_favorite ? '取消收藏' : '收藏') + '</button>';
                    html += '<button class="btn btn-danger" onclick="deleteWork(' + a.id + ')">删除</button>';
                    html += '</div></div>';
                });
                list.innerHTML = html;
            })
            .catch(() => {
                list.innerHTML = '<div class="loading">加载失败，请刷新重试</div>';
            });
        }

        function renameWork(id) {
            const current = prompt('请输入新的标题：');
            if (current === null) return;
            const title = current.trim();
            if (!title) { alert('标题不能为空'); return; }
            fetch('/api/articles/' + id + '/rename', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title })
            })
            .then(res => res.json())
            .then(() => loadArticles())
            .catch(() => alert('重命名失败，请重试'));
        }

        function toggleFav(id) {
            fetch('/api/articles/' + id + '/favorite', { method: 'POST' })
            .then(res => res.json())
            .then(() => loadArticles())
            .catch(() => alert('操作失败，请重试'));
        }

        function deleteWork(id) {
            if (!confirm('确定删除这篇作品？删除后无法恢复。')) return;
            fetch('/api/articles/' + id, { method: 'DELETE' })
            .then(res => res.json())
            .then(() => loadArticles());
        }

        loadGenres();
        loadArticles();
    </script>
</body>
</html>
