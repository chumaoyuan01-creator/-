<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <title>创作历史 · 墨韵</title>
    <link rel="stylesheet" href="/static/style.css?v=15">
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">
            <span class="brand-icon">✒️</span>
            墨韵
            <span class="brand-sub">AI 写作</span>
        </div>
        <nav class="topbar-nav">
            <a href="/">创作工作台</a>
            <a href="/history" class="active">创作历史</a>
            <span class="topbar-user" id="userInfo"></span>
            <a href="javascript:void(0)" id="authLink" class="btn btn-sm btn-primary" onclick="openAuthModal('login')">登录 / 注册</a>
        </nav>
    </header>

    <div class="workspace" style="max-width:1100px;margin:0 auto;padding:32px;">
        <div class="result-header">
            <h2 style="font-size:24px;font-weight:700;">📜 创作历史</h2>
            <div style="display:flex;gap:10px;align-items:center;">
                <input type="text" class="input-field" id="searchInput" placeholder="搜索文章..." style="width:240px;">
                <select class="input-field" id="genreFilter" style="width:140px;">
                    <option value="">全部体裁</option>
                </select>
                <button class="btn btn-sm" id="favFilter" onclick="toggleFavFilter()" style="white-space:nowrap;">⭐ 收藏</button>
            </div>
        </div>

        <div id="articleList" style="display:flex;flex-direction:column;gap:12px;margin-top:20px;"></div>

        <div id="emptyState" class="workspace-empty" style="display:none;">
            <div class="icon">📭</div>
            <div class="text">暂无作品</div>
            <div class="hint">去创作工作台生成你的第一篇文章吧</div>
        </div>

        <div id="loadingState" class="loading-state" style="display:none;">
            <div class="spinner"></div>
            <p style="margin-top:12px;color:var(--text-tertiary);">加载中...</p>
        </div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <button class="modal-close" onclick="closeAuthModal()">✕</button>
            <div class="modal-icon">✒️</div>
            <h2 id="authTitle">欢迎回来</h2>
            <p class="modal-subtitle" id="authSubtitle">登录你的账号，继续创作之旅</p>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" class="input-field" id="authUsername" placeholder="请输入用户名（2-20个字符）">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" class="input-field" id="authPassword" placeholder="请输入密码（至少6位）">
            </div>
            <div class="error-msg" id="authError"></div>
            <button class="modal-btn" id="authSubmit" onclick="submitAuth()">登录</button>
            <div class="switch-text">
                <span id="switchText">还没有账号？</span>
                <a id="switchLink" onclick="openAuthModal('register')">立即注册</a>
            </div>
            <div class="modal-footer">🔒 安全加密传输 · 你的数据只属于你</div>
        </div>
    </div>

    <script>
        let authMode = 'login';
        let favFilterOn = false;

        function openAuthModal(mode) {
            authMode = mode;
            document.getElementById('authModal').classList.add('show');
            document.getElementById('authTitle').textContent = mode === 'login' ? '欢迎回来' : '创建账号';
            document.getElementById('authSubtitle').textContent = mode === 'login' ? '登录你的账号，继续创作之旅' : '注册墨韵账号，开启 AI 创作之旅';
            document.getElementById('authSubmit').textContent = mode === 'login' ? '登录' : '注册';
            document.getElementById('switchText').textContent = mode === 'login' ? '还没有账号？' : '已有账号？';
            document.getElementById('switchLink').textContent = mode === 'login' ? '立即注册' : '去登录';
            document.getElementById('authError').classList.remove('show');
            history.pushState({ modalOpen: true }, '');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('show');
            if (history.state && history.state.modalOpen) history.back();
        }

        window.addEventListener('popstate', function(e) {
            if (e.state && e.state.modalOpen) document.getElementById('authModal').classList.remove('show');
        });

        document.addEventListener('click', function(e) {
            if (e.target.id === 'authModal') closeAuthModal();
        });

        function submitAuth() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const errorEl = document.getElementById('authError');
            if (!username || !password) { errorEl.textContent = '请填写用户名和密码'; errorEl.classList.add('show'); return; }
            fetch('/api/' + authMode, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            }).then(res => res.json()).then(data => {
                if (data.error) { errorEl.textContent = data.error; errorEl.classList.add('show'); }
                else { document.getElementById('authModal').classList.remove('show'); checkUserStatus(); loadArticles(); }
            }).catch(() => { errorEl.textContent = '请求失败，请重试'; errorEl.classList.add('show'); });
        }

        function checkUserStatus() {
            fetch('/api/user/status').then(res => res.json()).then(data => {
                const ui = document.getElementById('userInfo');
                const al = document.getElementById('authLink');
                if (data.logged_in) {
                    ui.textContent = '👤 ' + data.username;
                    al.textContent = '退出';
                    al.onclick = () => { fetch('/api/logout', { method: 'POST' }).then(() => location.reload()); };
                }
            });
        }

        function toggleFavFilter() {
            favFilterOn = !favFilterOn;
            document.getElementById('favFilter').style.background = favFilterOn ? 'var(--accent-soft)' : '';
            document.getElementById('favFilter').style.color = favFilterOn ? 'var(--accent-strong)' : '';
            loadArticles();
        }

        function loadArticles() {
            const q = document.getElementById('searchInput').value.trim();
            const genre = document.getElementById('genreFilter').value;
            const fav = favFilterOn ? '1' : '';
            const params = new URLSearchParams();
            if (q) params.set('q', q);
            if (genre) params.set('genre', genre);
            if (fav) params.set('fav', fav);

            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('articleList').innerHTML = '';
            document.getElementById('emptyState').style.display = 'none';

            fetch('/api/articles?' + params.toString())
            .then(res => res.json())
            .then(data => {
                document.getElementById('loadingState').style.display = 'none';
                if (!data.articles || data.articles.length === 0) {
                    document.getElementById('emptyState').style.display = 'flex';
                    return;
                }
                const list = document.getElementById('articleList');
                data.articles.forEach(a => {
                    const card = document.createElement('div');
                    card.style.cssText = 'background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:20px;display:flex;justify-content:space-between;align-items:center;transition:all var(--transition);';
                    card.onmouseenter = () => { card.style.borderColor = 'var(--border-strong)'; card.style.boxShadow = 'var(--shadow-sm)'; };
                    card.onmouseleave = () => { card.style.borderColor = 'var(--border-default)'; card.style.boxShadow = 'none'; };
                    card.innerHTML = `
                        <div style="flex:1;cursor:pointer;" onclick="location.href='/article/${a.id}'">
                            <h4 style="font-size:16px;font-weight:600;margin-bottom:6px;">${escapeHtml(a.title)}</h4>
                            <div style="font-size:12px;color:var(--text-tertiary);display:flex;gap:12px;">
                                <span>📂 ${escapeHtml(a.genre)}</span>
                                <span>📝 ${a.word_count || 0} 字</span>
                                <span>📖 ${a.chapter_count || 1} 章</span>
                                <span>🕐 ${a.created_at || ''}</span>
                            </div>
                        </div>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <span style="cursor:pointer;font-size:18px;" onclick="event.stopPropagation();toggleFav(${a.id})">${a.is_favorite ? '⭐' : '☆'}</span>
                            <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();renameArticle(${a.id}, '${escapeHtml(a.title)}')">✏️</button>
                            <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();deleteArticle(${a.id})" style="color:var(--danger);">🗑️</button>
                        </div>
                    `;
                    list.appendChild(card);
                });
            })
            .catch(() => {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('emptyState').style.display = 'flex';
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function toggleFav(id) {
            fetch('/api/articles/' + id + '/favorite', { method: 'POST' }).then(() => loadArticles());
        }

        function renameArticle(id, oldTitle) {
            const newTitle = prompt('请输入新标题：', oldTitle);
            if (newTitle && newTitle.trim()) {
                fetch('/api/articles/' + id + '/rename', {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newTitle.trim() })
                }).then(() => loadArticles());
            }
        }

        function deleteArticle(id) {
            if (confirm('确定要删除这篇文章吗？此操作不可恢复。')) {
                fetch('/api/articles/' + id, { method: 'DELETE' }).then(() => loadArticles());
            }
        }

        // 加载体裁列表
        fetch('/api/genres').then(res => res.json()).then(data => {
            const sel = document.getElementById('genreFilter');
            (data.genres || []).forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                sel.appendChild(opt);
            });
        });

        // 搜索防抖
        let searchTimer;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(loadArticles, 300);
        });
        document.getElementById('genreFilter').addEventListener('change', loadArticles);

        checkUserStatus();
        loadArticles();
    </script>
</body>
</html>
